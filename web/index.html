<!doctype html><html lang="my"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EggNest</title><link rel="stylesheet" href="style.css"><script src="https://telegram.org/js/telegram-web-app.js"></script></head><body><div class="app"><header><div><b>🥚 EggNest</b><small> Farm & Rewards</small></div><span id="level">Lv.1</span></header><section class="stats"><div>💰<b id="points">0</b><small>အမှတ်</small></div><div>🥚<b id="eggs">0</b><small>ဥ</small></div><div>⚡<b id="energy">100</b><small>Energy</small></div></section><section class="farm"><div class="sun">☀️</div><div class="cloud">☁️</div><div class="coop">🏠🐔🐔</div><button id="egg" class="egg">🥚</button><p id="msg">ဥကိုနှိပ်ပြီး စုပါ!</p></section><div class="grid"><button onclick="daily()">🎁<span>နေ့စဉ်ဆု</span></button><button onclick="game()">🎮<span>ဂိမ်း</span></button><button onclick="video()">🎬<span>ဗီဒီယို</span></button><button onclick="tasks()">🎯<span>Tasks</span></button><button onclick="invite()">👥<span>ဖိတ်ခေါ်</span></button><button onclick="shop()">🏪<span>ဆိုင်</span></button><button onclick="payment()">💳<span>Payment</span></button></div><section class="info"><b>💳 Payment</b><p>Deposit / Withdrawal request များကို Telegram Bot မှာ တင်ပြီး Admin စစ်ဆေးနိုင်ပါတယ်။</p></section></div><script src="app.js"></script></body></html>
